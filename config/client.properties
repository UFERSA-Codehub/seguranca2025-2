# Discovery Service
discovery.host=127.0.0.1
discovery.port=4000

# Usuários (formato: usuario:senha:descricao)
users.1=admin:admin123:Administrador
users.2=client1:senha123:Cliente 1
users.3=client2:senha456:Cliente 2

# Localizações
locations.1=Parque Central
locations.2=Zona Industrial
locations.3=Centro Comercial
locations.4=Área Residencial

# Timeouts HTTP (milissegundos)
http.connect.timeout=5000
http.read.timeout=3000

# Retry configuration
retry.enabled=true
retry.max.attempts=3
retry.initial.delay.ms=2000
retry.exponential.backoff=true

# Token cache configuration
cache.enabled=true
cache.token.ttl.hours=23
cache.directory=.cache

# HTTPS configuration (development mode)
https.enabled=false
https.verify.hostname=false
https.truststore.path=
https.truststore.password=